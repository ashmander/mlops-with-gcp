name: reusable-deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  APP_ENV: ${{ inputs.environment }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
  MODEL_BUCKET: ${{ vars.MODEL_BUCKET }}
  MODEL_PREFIX: ${{ vars.MODEL_PREFIX }}
  TEST_DATA_BUCKET: ${{ vars.TEST_DATA_BUCKET }}
  TEST_DATA_BLOB: ${{ vars.TEST_DATA_BLOB }}
  PREDICTIONS_BUCKET: ${{ vars.PREDICTIONS_BUCKET }}
  PROB_THRESHOLD: ${{ vars.PROB_THRESHOLD }}
  METRIC_THRESHOLD: ${{ vars.METRIC_THRESHOLD }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch model and test data
        env:
          PYTHONPATH: .
        run: uv run python scripts/fetch_artifacts.py

      - name: Run tests
        run: uv run pytest -s

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Fetch model artifacts for image build
        env:
          PYTHONPATH: .
        run: |
          uv sync --frozen
          uv run python scripts/fetch_artifacts.py --skip-test-data

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        shell: bash
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/model-api-${APP_ENV}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "model-api-${APP_ENV}" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "APP_ENV=${APP_ENV},GCP_PROJECT_ID=${GCP_PROJECT_ID},MODEL_BUCKET=${MODEL_BUCKET},MODEL_PREFIX=${MODEL_PREFIX},PREDICTIONS_BUCKET=${PREDICTIONS_BUCKET},PROB_THRESHOLD=${PROB_THRESHOLD},METRIC_THRESHOLD=${METRIC_THRESHOLD}"

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check deployed service
        shell: bash
        run: |
          URL="$(gcloud run services describe "model-api-${APP_ENV}" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          curl --fail "$URL/health"
