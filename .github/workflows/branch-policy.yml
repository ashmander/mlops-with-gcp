name: branch-policy

on:
  pull_request:
    branches: [dev, prod]

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        shell: bash
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "prod" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::PRs to prod are only allowed from dev."
            exit 1
          fi
          if [ "$BASE" = "dev" ] && [[ "$HEAD" != feature/* ]]; then
            echo "::error::PRs to dev are only allowed from feature/**."
            exit 1
          fi
