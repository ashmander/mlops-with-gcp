[project]
name = "mlops-with-gcp"
version = "0.1.0"
description = "Automatic deployment of an ONNX GoEmotions model with FastAPI, GitHub Actions and GCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-cloud-storage>=2.18.0",
    "numpy>=1.26.4",
    "onnxruntime>=1.18.1",
    "pydantic-settings>=2.4.0",
    "tokenizers>=0.19.1",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
