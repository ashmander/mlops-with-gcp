[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlops-gcp-onnx"
version = "0.1.0"
description = "Automatic ONNX model deployment system with GCP + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Andres Felipe Gonzalez", email = "chesmaster02@gmail.com"},
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "onnxruntime>=1.16.0",
    "tokenizers>=0.14.0",
    "transformers>=4.34.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "google-cloud-storage>=2.10.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]
